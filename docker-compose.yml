services:

  db:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - backend

  api:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    command: >
      gunicorn
      --bind 0.0.0.0:5000
      --workers 2
      --access-logfile -
      admin:create_app()

    ports:
      - "127.0.0.1:8000:5000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

  proxy:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    command: python proxy.py

    ports:
      - "8888:8888"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
